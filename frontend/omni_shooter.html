let activeCategory = 'all';
let searchQuery = '';

// ═══════════════════════════════════════════════════════════════════════════════
// UI FUNCTIONS
// ═══════════════════════════════════════════════════════════════════════════════
function showTab(name) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    event.target.classList.add('active');
}

function renderModules() {
    const container = document.getElementById('modules-container');
    container.innerHTML = '';
    
    const filtered = MODULES.filter(mod => {
        const matchCat = activeCategory === 'all' || mod.cat === activeCategory;
        const matchSearch = !searchQuery || 
            mod.name.toLowerCase().includes(searchQuery) || 
            mod.id.toLowerCase().includes(searchQuery) ||
            mod.desc.toLowerCase().includes(searchQuery);
        return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#ff4444;text-align:center;">Keine Module gefunden.</p>';
        return;
    }

    filtered.forEach((mod) => {
        const div = document.createElement('div');
        div.className = 'module';
        div.innerHTML = `
            <div class="module-header" onclick="toggleModule('${mod.id}')">
                <div>
                    <span class="module-title">[${mod.id}] ${mod.name}</span>
                    <div class="module-category">${mod.cat}</div>
                    <div style="font-size:0.75rem; color:#8080a0; margin-top:3px;">${mod.desc}</div>
                </div>
                <span class="module-badge">${mod.lang.toUpperCase()}</span>
            </div>
            <div class="module-body" id="body-${mod.id}">
                <pre><code class="language-${mod.lang}">${escapeHtml(mod.code)}</code></pre>
                <button class="export-btn" onclick="exportSingle('${mod.id}')">⬇ ${mod.name.split('/').pop()} exportieren</button>
            </div>
        `;
        container.appendChild(div);
    });
    
    if (window.Prism) Prism.highlightAll();
}

function toggleModule(id) {
    const body = document.getElementById('body-' + id);
    if (body) body.classList.toggle('active');
}

function filterModules() {
    searchQuery = document.getElementById('search').value.toLowerCase();
    activeCategory = document.getElementById('category-filter').value;
    renderModules();
}

function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ═══════════════════════════════════════════════════════════════════════════════
// EXPORT

function exportSingle(id) {
    const mod = MODULES.find(m => m.id === id);
    if (!mod) return;
    const blob = new Blob([mod.code], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = mod.name.split('/').pop();
    a.click();
    URL.revokeObjectURL(url);
}

function exportAll() {
    const all = MODULES.map(m => 
        `// ═══════════════════════════════════════════════════════════\n// [${m.id}] ${m.name} (${m.lang})\n// Kategorie: ${m.cat}\n// ${m.desc}\n// ═══════════════════════════════════════════════════════════\n${m.code}\n\n`
    ).join('');
    const blob = new Blob([all], {type: 'text/plain'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'black_six_matrix_74_modules_' + Date.now() + '.txt';
    a.click();
    URL.revokeObjectURL(url);
}

// ═══════════════════════════════════════════════════════════════════════════════
// CHAT
// ═══════════════════════════════════════════════════════════════════════════════
async function sendMessage() {
    const input = document.getElementById('chat-input');
    const output = document.getElementById('chat-output');
    const msg = input.value.trim();
    if (!msg) return;
    
    output.innerHTML += `<div class="user">👤 Du: ${escapeHtml(msg)}</div>`;
    input.value = '';
    output.scrollTop = output.scrollHeight;
    
    output.innerHTML += `<div class="system" id="typing">⚫ Matrix denkt nach...</div>`;
    output.scrollTop = output.scrollHeight;
    
    try {
        const API_URL = 'https://aragon-backend-api.onrender.com/prompt/check';
        const SEAL = 'Φ_SOVEREIGN_ROOT_SEAL_EX_TUNC';
        
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({prompt: msg, auth_seal: SEAL})
        });
        
        document.getElementById('typing')?.remove();
        
        if (res.ok) {
            const data = await res.json();
            const answer = data.data?.ai_answer || data.ai_answer || 'Keine Antwort.';
            const matched = data.data?.entities_matched || [];
            output.innerHTML += `<div class="system">⚫ Matrix: ${escapeHtml(answer)}</div>`;
            if (matched.length > 0) {
                output.innerHTML += `<div style="color:#8080a0;font-size:0.75rem;">🎯 RAG: ${matched.join(', ')}</div>`;
            }
        } else {
            output.innerHTML += `<div class="system" style="color:#ff4444;">⚫ HTTP ${res.status}: Fail-Closed</div>`;
        }
    } catch (e) {
        document.getElementById('typing')?.remove();
        output.innerHTML += `<div class="system" style="color:#ff4444;">⚫ Verbindungsfehler: ${escapeHtml(e.message)}</div>`;
    }
    output.scrollTop = output.scrollHeight;
}
